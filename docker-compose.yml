name: journal_watch

services:
  db:
    image: mysql:8.0
    container_name: journal_watch_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-journal_watch_v2}
    ports:
      - "3310:3306"
    volumes:
      - journal_watch_db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: journal_watch_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "3002:3000"
      - "5902:5900"
      - "6082:6080"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  journal_watch_db_data:
